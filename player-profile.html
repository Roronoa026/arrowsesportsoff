<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Player Profile | Arrows Esports</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#050807;color:#fff;font-family:Poppins,sans-serif}.nav{position:sticky;top:0;z-index:20;padding:14px 6%;display:flex;justify-content:space-between;align-items:center;background:rgba(3,8,5,.92);backdrop-filter:blur(12px);border-bottom:1px solid #164b29}.logo{font-weight:800;color:#39ff14;font-size:20px}.nav a{color:#ddd;text-decoration:none;margin-left:20px}.nav a:hover{color:#39ff14}.wrap{max-width:1100px;margin:auto;padding:35px 20px}.back{color:#39ff14;text-decoration:none}.profile{margin-top:20px;padding:30px;border:1px solid #1b5d30;border-radius:24px;background:radial-gradient(circle at top,#0d3d1c,#0b120d 60%);display:flex;gap:25px;align-items:center}.avatar{width:130px;height:130px;border-radius:20px;object-fit:cover;background:#163b21;border:2px solid #39ff14;display:flex;align-items:center;justify-content:center;font-size:55px;font-weight:800;color:#39ff14}.profile h1{font-size:42px;margin:0}.muted{color:#9aa79e}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin:20px 0}.stat{background:#0d1710;border:1px solid #173d23;border-radius:16px;padding:20px;text-align:center}.stat b{font-size:30px;color:#39ff14;display:block}.card{background:#0d1710;border:1px solid #173d23;border-radius:18px;padding:20px;margin-top:18px}.history{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:16px 0;border-bottom:1px solid #193522}.history:last-child{border:0}.pill{background:#153b20;color:#7dff9a;border:1px solid #27683b;border-radius:999px;padding:7px 11px;font-size:12px}.empty{padding:50px;text-align:center;color:#aaa}@media(max-width:700px){.profile{flex-direction:column;text-align:center}.profile h1{font-size:32px}.stats{grid-template-columns:repeat(2,1fr)}.nav{flex-direction:column;gap:10px}.nav a{margin:0 8px}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head><body><div class="nav"><div class="logo">ARROWS ESPORTS</div><div><a href="index.html">Home</a><a href="Tournaments.html">Tournaments</a><a href="Playerdetails.html">Players</a></div></div><main class="wrap"><a class="back" href="Playerdetails.html">← Back to Players</a><div id="app"></div></main><script>
/* Shared cache API fallback.
   This prevents stale/missing player-data.js from stopping Supabase startup. */
window.__ARROWS_TOURNAMENT_CACHE = window.__ARROWS_TOURNAMENT_CACHE || null;
window.arrowsSetTournamentCache = window.arrowsSetTournamentCache || function(t){
  window.__ARROWS_TOURNAMENT_CACHE = (t && typeof t === "object") ? t : null;
};
</script>
<script src="player-data.js?v=20260821-relational2"></script><script>
async function render(){await arrowsReady(true);const id=new URLSearchParams(location.search).get('id');const p=arrowsGetPlayer(id);const app=document.getElementById('app');if(!p){app.innerHTML='<div class="empty"><h2>Player not found</h2><p>The player may not have been registered yet.</p></div>';return}const s=arrowsPlayerStats(id);const initial=arrowsEscape(p.name.charAt(0).toUpperCase());const avatar=p.photo?`<img class="avatar" src="${arrowsEscape(p.photo)}" alt="${arrowsEscape(p.name)}">`:`<div class="avatar">${initial}</div>`;app.innerHTML=`<section class="profile">${avatar}<div><h1>${arrowsEscape(p.name)}</h1><p class="muted">eFootball ID: ${arrowsEscape(p.efootballId||'Not added')} · ${arrowsEscape(p.country||'Country not added')}</p><span class="pill">ARROWS ESPORTS CLAN MEMBER</span></div></section><section class="stats"><div class="stat"><b>${s.tournaments}</b>Tournaments</div><div class="stat"><b>${s.matches}</b>Matches</div><div class="stat"><b>${s.goals}</b>Goals</div><div class="stat"><b>${s.assists}</b>Assists</div><div class="stat"><b>${s.motm}</b>MOTM</div></section><section class="card"><h2>🏆 Tournament History</h2>${s.history.length?s.history.map(h=>`<div class="history"><div><strong>${arrowsEscape(h.tournament)}</strong><div class="muted">${h.teams.map(arrowsEscape).join(' · ')}</div></div><div><span class="pill">⚽ ${h.goals}</span> <span class="pill">🎮 ${h.matches}</span> <span class="pill">⭐ ${h.motm}</span></div></div>`).join(''):'<p class="muted">No tournament statistics recorded yet.</p>'}</section>`}arrowsReady().then(render).catch(e=>{console.error(e);document.getElementById('app').innerHTML='<div class="empty"><h2>Could not load player</h2><p>Supabase connection failed.</p></div>'});
</script></body></html>
