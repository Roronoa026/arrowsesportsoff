<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rankings | Arrows Esports</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Barlow+Condensed:wght@700;800;900&display=swap" rel="stylesheet"><style>

(--g)}.loss{color:#ff7777}.rate{color:#d8ffe0}.empty{text-align:center;padding:50px;color:#aaa}@media(max-width:850px){.podium{grid-template-columns:1fr}.pod.first{order:-1}.table{overflow:auto}.row{min-width:900px}.nav{flex-direction:column;gap:8px}.nav a{margin:0 8px}}

</head><body><header class="nav"><div class="logo"><img src="arrowslogo.png" alt="Arrows"> ARROWS ESPORTS</div><nav><a href="index.html">Home</a><a href="Tournaments.html">Tournaments</a><a href="Playerdetails.html">Players</a><a class="active" href="rankings.html">Rankings</a></nav></header><main class="wrap"><section class="hero"><div class="ey">OFFICIAL PLAYER PERFORMANCE</div><h1>Player Rankings</h1><p>Wins, losses, goals and match performance across recorded tournaments.</p></section><section id="podium" class="podium"></section><section id="table" class="table"></section></main><script>
/* Shared cache API fallback.
   This prevents stale/missing player-data.js from stopping Supabase startup. */
window.__ARROWS_TOURNAMENT_CACHE = window.__ARROWS_TOURNAMENT_CACHE || null;
window.arrowsSetTournamentCache = window.arrowsSetTournamentCache || function(t){
  window.__ARROWS_TOURNAMENT_CACHE = (t && typeof t === "object") ? t : null;
};
</script>
<script src="player-data.js?v=20260827-duostats1"></script><script>
async function render(){await arrowsReady(true);const rows=arrowsGetPlayers().map(p=>({p,s:arrowsPlayerStats(p.id)})).sort((a,b)=>b.s.wins-a.s.wins||b.s.winRate-a.s.winRate||b.s.goals-a.s.goals||b.s.matches-a.s.matches);const pod=document.getElementById('podium');pod.innerHTML=rows.slice(0,3).map((x,i)=>`<article class="pod ${i===0?'first':''}"><div class="medal">${['🥇','🥈','🥉'][i]}</div><h2>${arrowsEscape(x.p.name)}</h2><div class="pts">${x.s.wins} W • ${x.s.losses} L</div><div class="muted">${x.s.winRate}% win rate</div></article>`).join('');const el=document.getElementById('table');if(!rows.length){el.innerHTML='<div class="empty">No player statistics yet.</div>';return}el.innerHTML='<div class="row head"><div>#</div><div>Player</div><div>MP</div><div>W</div><div>L</div><div>D</div><div>Win %</div><div>Goals</div><div>Conceded</div><div>MOTM</div></div>'+rows.map((x,i)=>`<div class="row"><div class="rank">${i+1}</div><div class="name"><a href="player-profile.html?id=${x.p.id}">${arrowsEscape(x.p.name)}</a><div class="muted">${arrowsEscape(x.p.efootballId||'')}</div></div><div class="num">${x.s.matches}</div><div class="num win">${x.s.wins}</div><div class="num loss">${x.s.losses}</div><div class="num">${x.s.draws}</div><div class="num rate">${x.s.winRate}%</div><div class="num">${x.s.goals}</div><div class="num">${x.s.goalsConceded}</div><div class="num">${x.s.motm}</div></div>`).join('')}arrowsReady().then(render).catch(e=>{console.error(e);document.getElementById('table').innerHTML='<div class="empty">No players</div>'});
</script></body></html>
