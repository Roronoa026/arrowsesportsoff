<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Player Management | Arrows Esports</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#050807;color:#fff;font-family:Poppins,sans-serif}.top{padding:20px 6%;background:linear-gradient(135deg,#082812,#12612a);display:flex;justify-content:space-between;align-items:center}.top a{color:#fff;text-decoration:none;margin-left:12px}.wrap{max-width:1200px;margin:auto;padding:30px 20px}.panel{background:#0c160f;border:1px solid #1a4e2b;border-radius:18px;padding:22px;margin-bottom:20px}.grid{display:grid;grid-template-columns:1fr 1.5fr;gap:20px}input{width:100%;padding:12px;margin:7px 0 13px;border:1px solid #244b31;border-radius:9px;background:#07100a;color:#fff}button{padding:11px 16px;border:0;border-radius:9px;background:#39ff14;color:#061008;font-weight:700;cursor:pointer}.secondary{background:#1b2c20;color:#fff}.danger{background:#d9363e;color:#fff}.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px}.player{padding:18px;background:#111d14;border:1px solid #214c2e;border-radius:15px}.player h3{margin:0 0 5px;color:#39ff14}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.small{padding:8px 10px;font-size:12px}.note{color:#9aa79e;font-size:13px}.toast{position:fixed;right:20px;bottom:20px;background:#39ff14;color:#061008;padding:13px 18px;border-radius:10px;font-weight:700;display:none}@media(max-width:800px){.grid{grid-template-columns:1fr}.top{flex-direction:column;gap:10px;text-align:center}}
</style>
<script>
/* ARROWS v5: safe Duo fixture generation fallback */
window.arrowsGenerateDuoFixtures = window.arrowsGenerateDuoFixtures || function(participants, groupCount) {
  const list = Array.isArray(participants) ? participants.filter(Boolean).slice() : [];
  let groups = Math.max(1, parseInt(groupCount, 10) || 1);
  groups = Math.min(groups, Math.max(1, list.length));
  const buckets = Array.from({length: groups}, () => []);
  list.forEach((item, i) => buckets[i % groups].push(item));
  const fixtures = [];
  buckets.forEach((bucket, gi) => {
    if (bucket.length < 2) return;
    for (let i = 0; i < bucket.length; i++) {
      for (let j = i + 1; j < bucket.length; j++) {
        fixtures.push({
          group: String.fromCharCode(65 + gi),
          home: bucket[i], away: bucket[j],
          status: "scheduled", homeScore: null, awayScore: null
        });
      }
    }
  });
  return fixtures;
};
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js?v=20260821-relational2"></script>
<script src="supabase-data.js?v=20260830-duoresults2"></script>
</head><body><header class="top"><div><h2 style="margin:0">✏️ Player Management</h2><small>ARROWS ESPORTS ADMIN</small></div><div><a href="editpage.html">Admin</a><a href="Playerdetails.html">View Players</a><a href="duo.html">Tournament</a></div></header><main class="wrap"><div class="grid"><section class="panel"><h2 id="formTitle">➕ Add Clan Player</h2><p class="note">Add a player once here. Tournament pages can then link that same player to different teams and tournaments.</p><input id="name" placeholder="Player name"><input id="eid" placeholder="eFootball ID"><input id="country" placeholder="Country"><input id="photo" placeholder="Photo path, e.g. images/Rexzo.jpeg"><div class="actions"><button onclick="savePlayer()">💾 Save Player</button><button class="secondary" onclick="resetForm()">Clear</button></div></section><section class="panel"><h2>👥 Clan Player Database</h2><input id="search" placeholder="Search players..." oninput="render()"><div id="list" class="list"></div></section></div></main><div id="toast" class="toast"></div><script>
/* Shared cache API fallback.
   This prevents stale/missing player-data.js from stopping Supabase startup. */
window.__ARROWS_TOURNAMENT_CACHE = window.__ARROWS_TOURNAMENT_CACHE || null;
window.arrowsSetTournamentCache = window.arrowsSetTournamentCache || function(t){
  window.__ARROWS_TOURNAMENT_CACHE = (t && typeof t === "object") ? t : null;
};
</script>
<script src="player-data.js?v=20260821-relational2"></script><script>

if(sessionStorage.getItem('footballAdminLoggedIn')!=='true'){location.href='admin-login.html'}
let editing=null;
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1800)}
function resetForm(){editing=null;document.getElementById('formTitle').textContent='➕ Add Clan Player';['name','eid','country','photo'].forEach(id=>document.getElementById(id).value='')}

async function savePlayer(){
  const name=document.getElementById('name').value.trim();
  if(!name){alert('Enter player name.');return}
  try{
    const data={name,efootballId:document.getElementById('eid').value.trim(),country:document.getElementById('country').value.trim(),photo:document.getElementById('photo').value.trim(),clanPlayerId:editing};
    const p=await arrowsRegisterPlayer(data);
    await syncTournamentPlayer(p);
    toast(editing?'Player updated':'Player added');
    resetForm();
    render();
  }catch(e){console.error(e);toast('Save failed: '+(e.message||'Supabase error'))}
}

async function syncTournamentPlayer(p){
  if(!p)return;
  let t=await ARROWS_DB.getTournament();
  if(!t||!Array.isArray(t.teams))return;
  let changed=false;
  t.teams.forEach(team=>(team.players||[]).forEach(tp=>{
    if(String(tp.clanPlayerId||'')===String(p.id) || String(tp.name||'').toLowerCase()===String(p.name||'').toLowerCase()){
      tp.clanPlayerId=p.id;tp.name=p.name;tp.efootballId=p.efootballId;tp.country=p.country;tp.photo=p.photo;changed=true;
    }
  }));
  if(changed){await ARROWS_DB.saveTournament(t);arrowsSetTournamentCache(t)}
}

function edit(id){const p=arrowsGetPlayer(id);if(!p)return;editing=p.id;document.getElementById('formTitle').textContent='✏️ Modify Player';document.getElementById('name').value=p.name;document.getElementById('eid').value=p.efootballId||'';document.getElementById('country').value=p.country||'';document.getElementById('photo').value=p.photo||'';scrollTo({top:0,behavior:'smooth'})}

async function remove(id){
  if(!confirm('Delete this clan player? Tournament records will remain but the common profile will be removed.'))return;
  try{await arrowsDeletePlayer(id);render();toast('Player deleted')}catch(e){console.error(e);toast('Delete failed: '+(e.message||'Supabase error'))}
}

async function render(){
  await arrowsReady();
  const q=document.getElementById('search').value.toLowerCase();
  const players=arrowsGetPlayers().filter(p=>(p.name+' '+p.efootballId+' '+p.country).toLowerCase().includes(q));
  document.getElementById('list').innerHTML=players.map(p=>{const s=arrowsPlayerStats(p.id);return `<article class="player"><h3>${arrowsEscape(p.name)}</h3><div class="note">${arrowsEscape(p.efootballId||'No eFootball ID')} · ${arrowsEscape(p.country||'No country')}</div><p>⚽ ${s.goals} goals · 🎮 ${s.matches} matches · ⭐ ${s.motm} MOTM</p><div class="actions"><button class="small" onclick="edit('${p.id}')">✏️ Modify</button><button class="small secondary" onclick="location.href='player-profile.html?id=${p.id}'">👁️ View</button><button class="small danger" onclick="remove('${p.id}')">🗑️ Delete</button></div></article>`}).join('')||'<p class="note">No players found.</p>'
}

arrowsReady().then(render).catch(e=>{console.error(e);toast('Could not connect to Supabase')});
</script></body></html>
