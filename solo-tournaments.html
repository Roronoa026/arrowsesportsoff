<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solo Tournaments | Arrows Esports</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="solo-tournament-data.js"></script><style>
:root{--bg:#06100c;--panel:#0d1915;--line:#20372c;--green:#00ff88;--muted:#91a99e;--text:#effbf5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#10291d,#06100c 52%);color:var(--text);font-family:Inter,Arial}.nav{padding:18px 5%;display:flex;justify-content:space-between;border-bottom:1px solid var(--line);background:#06100cee;position:sticky;top:0;z-index:5}.nav a{color:#d5e7dd;text-decoration:none;margin-left:20px}.brand{font-weight:900}.brand span{color:var(--green)}main{max-width:1250px;margin:35px auto;padding:0 18px}.hero h1{font-size:42px;margin:5px 0}.eyebrow{color:var(--green);font-size:12px;font-weight:900;letter-spacing:2px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card,.panel{background:#0b1713ee;border:1px solid var(--line);border-radius:18px;padding:18px}.card{cursor:pointer;transition:.2s}.card:hover{transform:translateY(-2px);border-color:#35785c}.small{color:var(--muted);font-size:12px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tab{padding:9px 13px;border:1px solid var(--line);border-radius:999px;background:#0b1713;color:white;cursor:pointer}.tab.active{background:var(--green);color:#03110a}.match{display:grid;grid-template-columns:1fr 80px 1fr;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.match:last-child{border-bottom:0}.center{text-align:center}.right{text-align:right}.groups{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.awardgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.award{text-align:center;padding:22px;border:1px solid var(--line);border-radius:15px;background:#09130f}.award .icon{font-size:35px}.avatar{width:55px;height:55px;border-radius:50%;object-fit:cover;background:#173025}.viewer{display:none}.viewer.show{display:block}.select{padding:12px;background:#0b1713;color:#fff;border:1px solid var(--line);border-radius:10px;min-width:280px}@media(max-width:850px){.grid,.groups,.awardgrid{grid-template-columns:1fr}.match{grid-template-columns:1fr 65px 1fr}}
</style></head><body><header class="nav"><div class="brand">🏹 ARROWS <span>ESPORTS</span></div><nav><a href="Tournaments.html">Tournaments</a><a href="Playerdetails.html">Players</a><a href="editpage.html">Admin</a></nav></header><main><section class="hero"><div class="eyebrow">SOLO COMPETITION</div><h1>Tournament Viewer</h1><p class="small">Fixtures, results and player awards — synced directly from the Arrows Supabase database.</p></section><section id="list" class="grid">Loading tournaments…</section><section id="viewer" class="viewer"><div class="panel"><div style="display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;align-items:center"><div><div class="eyebrow">TOURNAMENT</div><h2 id="title"></h2><div id="meta" class="small"></div></div><button class="tab" onclick="showList()">← All Tournaments</button></div><div class="tabs"><button class="tab active" onclick="tab('fixtures',this)">Fixtures</button><button class="tab" onclick="tab('awards',this)">Player Awards</button></div><div id="fixturesView"></div><div id="awardsView" style="display:none"></div></div></section></main><script>
let players=[],tournaments=[],current=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function pname(id){return players.find(p=>String(p.id)===String(id))?.name||'TBD'}
async function boot(){players=await ARROWS_SOLO_DB.getPlayers();tournaments=await ARROWS_SOLO_DB.listTournaments();renderList();const id=new URLSearchParams(location.search).get('id');if(id)openTournament(id)}function renderList(){$('list').innerHTML=tournaments.map(t=>`<article class="card" onclick="openTournament('${t.id}')"><div class="eyebrow">${esc(t.type)}</div><h2>${esc(t.name)}</h2><p class="small">${esc(t.description||'Arrows Esports Solo Tournament')}</p><b>${new Date(t.created_at).toLocaleDateString()}</b></article>`).join('')||'<div class="panel">No solo tournaments published yet.</div>'}
async function openTournament(id){current=await ARROWS_SOLO_DB.getTournament(id);if(!current)return;history.replaceState({},'',location.pathname+'?id='+encodeURIComponent(id));$('list').style.display='none';$('viewer').classList.add('show');$('title').textContent=current.name;$('meta').textContent=(current.description||'')+' • '+current.type.replace('_',' + ');renderFixtures();renderAwards()}
function showList(){$('viewer').classList.remove('show');$('list').style.display='grid';history.replaceState({},'',location.pathname)}
function tab(which,btn){document.querySelectorAll('.tabs .tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active');$('fixturesView').style.display=which==='fixtures'?'block':'none';$('awardsView').style.display=which==='awards'?'block':'none'}
function renderFixtures(){const f=current.fixtures||[];if(!f.length){$('fixturesView').innerHTML='<p class="small">Fixtures have not been created yet.</p>';return}const groups=[...new Set(f.filter(x=>x.group_name).map(x=>x.group_name))];let html='';if(groups.length){html+='<div class="groups">'+groups.map(g=>'<div class="panel"><h3>Group '+esc(g)+'</h3>'+f.filter(x=>x.group_name===g).map(matchHTML).join('')+'</div>').join('')+'</div>'}const ko=f.filter(x=>x.stage==='Knockout'||!x.group_name);if(ko.length)html+='<div class="panel"><h3>Knockout / Final Stage</h3>'+ko.map(matchHTML).join('')+'</div>';const league=f.filter(x=>x.stage==='League');if(league.length)html+='<div class="panel"><h3>League Fixtures</h3>'+league.map(matchHTML).join('')+'</div>';$('fixturesView').innerHTML=html}
function matchHTML(m){return `<div class="match"><div><b>${esc(pname(m.home_player_id))}</b></div><div class="center"><b>${m.status==='completed'?esc(m.home_score)+' : '+esc(m.away_score):'VS'}</b><div class="small">${esc(m.stage)} · R${m.round||1}</div></div><div class="right"><b>${esc(pname(m.away_player_id))}</b></div></div>`}
function renderAwards(){const icons={golden_ball:'🏆',golden_glove:'🧤',best_player:'⭐'};const names={golden_ball:'Golden Ball',golden_glove:'Golden Glove',best_player:'Best Player'};const a=Object.fromEntries((current.awards||[]).map(x=>[x.award_type,x]));$('awardsView').innerHTML='<div class="awardgrid">'+Object.keys(names).map(k=>`<div class="award"><div class="icon">${icons[k]}</div><h3>${names[k]}</h3><b>${esc(a[k]?pname(a[k].player_id):'Not awarded')}</b>${a[k]?.player?.photo?`<br><img class="avatar" src="${esc(a[k].player.photo)}">`:''}</div>`).join('')+'</div>'}boot().catch(e=>{$('list').innerHTML='<div class="panel">Could not load tournaments: '+esc(e.message)+'</div>'});
</script></body></html>
