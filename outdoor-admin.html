<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Outdoor Tournament Admin | Arrows Esports</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#050807;color:#fff;font-family:Poppins,sans-serif}.top{padding:20px 6%;background:linear-gradient(135deg,#082812,#12612a);display:flex;justify-content:space-between;align-items:center}.top a{color:#fff;text-decoration:none;margin-left:14px}.wrap{max-width:1200px;margin:auto;padding:30px 20px}.panel{background:#0c160f;border:1px solid #1a4e2b;border-radius:18px;padding:22px;margin-bottom:20px}.grid{display:grid;grid-template-columns:1fr 1.4fr;gap:20px}label{display:block;color:#a9b7ad;font-size:13px;margin-top:10px}input,textarea{width:100%;padding:12px;margin-top:5px;border:1px solid #244b31;border-radius:9px;background:#07100a;color:#fff}textarea{min-height:80px}.players{display:grid;gap:10px;margin-top:14px}.prow{display:grid;grid-template-columns:1fr 85px 85px 85px;gap:8px;align-items:end;background:#101d13;padding:12px;border-radius:12px}.prow input{margin:0}.record{border:1px solid #214c2e;border-radius:14px;padding:16px;margin:12px 0}.record h3{color:#39ff14;margin:0 0 4px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button{padding:11px 16px;border:0;border-radius:9px;background:#39ff14;color:#061008;font-weight:800;cursor:pointer}.secondary{background:#1b2c20;color:#fff}.danger{background:#d9363e;color:#fff}.note{color:#91a096;font-size:13px}.empty{color:#91a096;padding:20px 0}@media(max-width:850px){.grid{grid-template-columns:1fr}.prow{grid-template-columns:1fr 1fr 1fr}.pname{grid-column:1/-1}.top{flex-direction:column;gap:8px}.top a{margin:0 7px}}
</style></head><body><script>if(sessionStorage.getItem('footballAdminLoggedIn')!=='true')location.href='admin-login.html'</script><header class="top"><div><h2 style="margin:0">🌍 Outdoor Tournament Admin</h2><small>ARROWS ESPORTS ADMIN</small></div><div><a href="editpage.html">Admin</a><a href="outdoortour.html">View Outdoor Page</a></div></header><main class="wrap"><div class="grid"><section class="panel"><h2 id="title">➕ Add Outdoor Tour</h2><p class="note">Create one tour, select the participating clan players, then enter each player’s wins, losses and draws.</p><label>Tour / Tournament name</label><input id="name" placeholder="e.g. Kerala eFootball Cup"><label>Date</label><input id="date" type="date"><label>Location / Organizer</label><input id="location" placeholder="e.g. Kochi"><label>Overall result / finish</label><input id="result" placeholder="e.g. Quarter Final / Champions"><label>Notes</label><textarea id="notes" placeholder="Optional tour summary"></textarea><h3>Player Records</h3><div id="playerRows" class="players"></div><div class="actions"><button onclick="save()">💾 Save Tour</button><button class="secondary" onclick="resetForm()">Clear</button></div></section><section class="panel"><h2>📋 Saved Outdoor Tours</h2><div id="records"></div></section></div></main>
<script>window.__ARROWS_TOURNAMENT_CACHE=null;window.arrowsSetTournamentCache=function(t){window.__ARROWS_TOURNAMENT_CACHE=t}</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=20260821-relational2"></script><script src="supabase-data.js?v=20260821-relational2"></script><script src="player-data.js?v=20260821-relational2"></script><script src="outdoor-data.js"></script><script>
let editing=null,players=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function init(){try{await arrowsReady();players=arrowsGetPlayers()}catch(e){console.error(e);players=[]}drawPlayers();renderRecords()}
function drawPlayers(selected=[]){const old=Object.fromEntries(selected.map(x=>[String(x.playerId||x.name),x]));document.querySelector('#playerRows').innerHTML=players.length?players.map(p=>{const x=old[String(p.id)]||{};return `<div class="prow" data-id="${esc(p.id)}" data-name="${esc(p.name)}"><label class="pname"><input type="checkbox" class="use" ${old[String(p.id)]?'checked':''}> ${esc(p.name)}</label><label>Wins<input class="w" type="number" min="0" value="${+x.wins||0}"></label><label>Losses<input class="l" type="number" min="0" value="${+x.losses||0}"></label><label>Draws<input class="d" type="number" min="0" value="${+x.draws||0}"></label></div>`}).join(''):'<div class="empty">No clan players found. Add players in Player Editing first.</div>'}
function save(){const name=document.querySelector('#name').value.trim();if(!name)return alert('Enter the tournament name.');const rows=[...document.querySelectorAll('.prow')].filter(r=>r.querySelector('.use').checked).map(r=>({playerId:r.dataset.id,name:r.dataset.name,wins:+r.querySelector('.w').value||0,losses:+r.querySelector('.l').value||0,draws:+r.querySelector('.d').value||0}));if(!rows.length)return alert('Select at least one player.');ARROWS_OUTDOOR.upsert({id:editing||ARROWS_OUTDOOR.id(),name,date:document.querySelector('#date').value,location:document.querySelector('#location').value.trim(),result:document.querySelector('#result').value.trim(),notes:document.querySelector('#notes').value.trim(),players:rows,updatedAt:new Date().toISOString()});resetForm();renderRecords()}
function editTour(id){const t=ARROWS_OUTDOOR.get().find(x=>x.id===id);if(!t)return;editing=id;document.querySelector('#title').textContent='✏️ Edit Outdoor Tour';['name','date','location','result','notes'].forEach(k=>document.querySelector('#'+k).value=t[k]||'');drawPlayers(t.players||[]);scrollTo({top:0,behavior:'smooth'})}
function del(id){if(confirm('Delete this outdoor tour record?')){ARROWS_OUTDOOR.remove(id);if(editing===id)resetForm();renderRecords()}}
function resetForm(){editing=null;document.querySelector('#title').textContent='➕ Add Outdoor Tour';['name','date','location','result','notes'].forEach(k=>document.querySelector('#'+k).value='');drawPlayers()}
function renderRecords(){const a=ARROWS_OUTDOOR.get().sort((x,y)=>String(y.date).localeCompare(String(x.date)));document.querySelector('#records').innerHTML=a.length?a.map(t=>`<div class="record"><h3>${esc(t.name)}</h3><div class="note">${esc(t.date||'No date')} · ${(t.players||[]).length} players${t.result?' · '+esc(t.result):''}</div><div class="actions"><button onclick="editTour('${t.id}')">✏️ Edit W/L/D</button><button class="danger" onclick="del('${t.id}')">🗑️ Delete</button></div></div>`).join(''):'<div class="empty">No outdoor tours saved yet.</div>'}init();
</script></body></html>
