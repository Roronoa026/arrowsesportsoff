<script>
/* ARROWS v5: safe Duo fixture generation fallback */
window.arrowsGenerateDuoFixtures = window.arrowsGenerateDuoFixtures || function(participants, groupCount) {
  const list = Array.isArray(participants) ? participants.filter(Boolean).slice() : [];
  let groups = Math.max(1, parseInt(groupCount, 10) || 1);
  groups = Math.min(groups, Math.max(1, list.length));
  const buckets = Array.from({length: groups}, () => []);
  list.forEach((item, i) => buckets[i % groups].push(item));
  const fixtures = [];
  buckets.forEach((bucket, gi) => {
    if (bucket.length < 2) return;
    for (let i = 0; i < bucket.length; i++) {
      for (let j = i + 1; j < bucket.length; j++) {
        fixtures.push({
          group: String.fromCharCode(65 + gi),
          home: bucket[i], away: bucket[j],
          status: "scheduled", homeScore: null, awayScore: null
        });
      }
    }
  });
  return fixtures;
};
</script>

async function render(){await arrowsReady(true);const q=document.getElementById('search').value.toLowerCase().trim();const all=arrowsGetPlayers();const ps=all.filter(p=>(p.name+' '+p.efootballId+' '+p.country).toLowerCase().includes(q));document.getElementById('count').textContent=ps.length+' player'+(ps.length===1?'':'s');document.getElementById('players').innerHTML=ps.map(p=>{const s=arrowsPlayerStats(p.id);const av=p.photo?`<img class="avatar" src="${arrowsEscape(p.photo)}" alt="${arrowsEscape(p.name)}">`:`<div class="avatar">${arrowsEscape(p.name.charAt(0).toUpperCase())}</div>`;return `<article class="card"><div class="top">${av}<div><h2>${arrowsEscape(p.name)}</h2><div class="muted">${arrowsEscape(p.efootballId||'eFootball ID not added')}</div><div class="muted">${arrowsEscape(p.country||'Country not added')}</div></div></div><div class="stats"><div class="stat"><b>${s.matches}</b><small>Matches</small></div><div class="stat w"><b>${s.wins}</b><small>Wins</small></div><div class="stat l"><b>${s.losses}</b><small>Losses</small></div><div class="stat rate"><b>${s.winRate}%</b><small>Win Rate</small></div></div><a class="view" href="player-profile.html?id=${p.id}">View Player Profile →</a></article>`}).join('')||'<div class="empty">No players found.</div>'}arrowsReady().then(render).catch(e=>{console.error(e);document.getElementById('players').innerHTML='<div class="empty">No Players</div>'});
</script></body></html>
